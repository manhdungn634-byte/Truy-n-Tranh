<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tủ truyện</title>
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tủ truyện">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#121214;--card:#1c1c20;--card2:#27272c;--line:#2e2e35;--fg:#f4f3f1;--mut:#8e8f99;--ac:#f0486b;--acfg:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f5f3;--card:#fff;--card2:#ebe9e5;--line:#dedcd6;--fg:#17181c;--mut:#6d6e75;--ac:#e5365a;color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f5f3;--card:#fff;--card2:#ebe9e5;--line:#dedcd6;--fg:#17181c;--mut:#6d6e75;--ac:#e5365a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "Be Vietnam Pro",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.tt{display:flex;align-items:center;gap:8px;padding:12px 16px 4px;position:relative}
.tt h2{margin:0;font-size:20px;flex:1}
.tt.c{justify-content:center;min-height:56px}.tt.c h2{flex:none;text-align:center}.tt.c .rb{position:absolute;right:12px}
.rb{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;flex:none}
.sr{display:flex;gap:10px;align-items:center;padding:12px 16px 4px}
.sbx{flex:1;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:0 14px;height:46px;color:var(--mut);background:var(--card)}
.sbx input{flex:1;min-width:0;border:0;background:none;outline:0}
.sbx svg{width:19px;height:19px}
.rk{background:none;border:0;padding:6px;color:var(--fg)}
.tabs{display:flex;gap:22px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:8px 0 9px;white-space:nowrap;font-size:17px;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:700}
.tabs.t2{flex:1;padding:0}
.chp{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px 4px}
.chip{border:0;background:var(--card2);border-radius:999px;padding:9px 16px}
.chip.on{background:var(--ac);color:var(--acfg);font-weight:600}
.ctl{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;color:var(--mut)}
.ck{background:none;border:0;display:flex;align-items:center;gap:8px;color:var(--mut);padding:0}
.ck i{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);display:block}
.ck i.on{border-color:var(--ac);background:radial-gradient(var(--ac) 45%,transparent 50%)}
.ctl select{background:none;border:0;color:var(--mut);outline:0}
main{padding-bottom:110px;max-width:900px;margin:0 auto}
.sc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:18px 8px 6px;text-align:center}
.sc button{background:none;border:0;color:var(--mut);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sc .ic{width:58px;height:58px;border-radius:18px;background:var(--card2);display:grid;place-items:center;color:var(--ac)}
.sc .ic svg{width:28px;height:28px}
.rh{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 12px}
.rh h3{margin:0;font-size:22px;font-weight:800}
.rh button{border:0;background:none;color:var(--mut);display:flex;align-items:center;gap:2px}
.rh button svg{width:16px;height:16px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.cd{position:relative;cursor:pointer;flex:0 0 130px;min-width:0}
.cd .cv{aspect-ratio:3/4;width:100%;object-fit:cover;border-radius:12px;background:var(--card);display:block}
.cd b{display:block;margin-top:7px;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd small{color:var(--mut);display:block;font-size:13px;margin-top:2px}
.cd small svg,.st svg{width:15px;height:15px;display:inline;vertical-align:-3px;margin-right:5px}
.cd.w{flex-basis:230px}.cd.w .cv{aspect-ratio:16/10}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.ed{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.ed svg{width:14px;height:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px;padding:14px 16px}
.grid .cd{flex:none}
.ls{padding:0 16px}
.li{display:flex;gap:14px;padding:12px 0;cursor:pointer;align-items:flex-start}
.lc{flex:none;width:96px}
.lc .cv{aspect-ratio:3/4;width:100%;object-fit:cover;border-radius:12px;background:var(--card);display:block}
.lb{flex:1;min-width:0}
.lb b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:16px;line-height:1.3}
.tg{display:inline-block;margin:6px 0 4px;border:1px solid var(--ac);color:var(--ac);border-radius:6px;padding:1px 8px;font-size:13px}
.lb p{margin:0 0 6px;color:var(--mut);font-size:14px}
.st{color:var(--mut);font-size:13px}
.la{display:flex;flex-direction:column;gap:6px}
.mini{width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);display:grid;place-items:center;font-size:17px;color:var(--ac)}
.mini svg{width:15px;height:15px;color:var(--fg)}
.sg{flex:0 0 150px;background:var(--card);border-radius:18px;padding:12px;text-align:center;cursor:pointer}
.sg .cv{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block;background:var(--card2)}
.sg b{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0}
.sg .btn{padding:8px 18px;border-radius:999px}
.rc{margin:16px;padding:20px;border-radius:20px;background:var(--card)}
.rc h3{margin:0 0 4px;font-size:20px}.rc p{margin:0 0 14px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:56px 24px}
.empty p{margin:0 0 18px}
.emp{text-align:center;color:var(--mut);padding:36px 0}.emp svg{width:64px;height:64px;margin:0 auto 8px;opacity:.5}
.btn{background:var(--ac);color:var(--acfg);border:0;border-radius:12px;padding:11px 16px;font-weight:700}
.btn svg{display:inline;vertical-align:-5px;margin-right:4px;width:18px;height:18px}
.btn.g{background:var(--card2);color:var(--fg)}
.btn.r{background:transparent;color:#ff5a5a;border:1px solid #ff5a5a}
.mh{background:linear-gradient(#6a2a3a,var(--bg) 92%);padding:12px 16px 18px;margin-bottom:6px}
.hic{display:flex;justify-content:flex-end;gap:10px}
.hic .rb{background:rgba(255,255,255,.14);color:#fff}
.pf{display:flex;align-items:center;gap:14px;margin:18px 0 22px}
.av{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,#5be08a,#25a85a);display:grid;place-items:center;font-size:30px;font-weight:800;color:#06210f;flex:none}
.av.g{background:#e8e6e2;color:#999}.av.g svg{width:38px;height:38px}
.nm{flex:1;min-width:0}
.nm h2{margin:0;font-size:20px}
.nm.lg{background:none;border:0;text-align:left;font-size:19px;font-weight:700;color:var(--fg)}
.lnk{background:none;border:0;padding:0;color:var(--mut);text-decoration:underline}
.stt{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stt b{display:block;font-size:26px}.stt span{color:var(--mut);font-size:14px}
.card{margin:14px 16px;padding:16px 0 16px 16px;border-radius:20px;background:var(--card)}
.card .ch{display:flex;justify-content:space-between;align-items:center;padding-right:12px}
.card h3{margin:0;font-size:20px}
.card .chp{padding:12px 16px 12px 0}
.card .chip{background:var(--card2);padding:7px 14px;font-size:14px}.card .chip.on{background:var(--ac)}
.card .hs{padding-left:0}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-right:16px;text-align:center}
.mg button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.mg svg{width:34px;height:34px;color:var(--ac)}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:12px}
.bn button.on{color:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:9;width:60px;height:60px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fab[hidden]{display:none}
.ph{display:grid;place-items:center;font-size:42px;font-weight:800;color:var(--mut);background:var(--card2)}
.pst{width:120px;aspect-ratio:3/4;border-radius:14px;border:2px dashed var(--line);background:var(--card2) center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:13px;text-align:center;cursor:pointer;overflow:hidden}
.fr{display:flex;gap:14px;align-items:flex-start}
.fr>div:last-child{flex:1;min-width:0}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden],#rd[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 6px;font-size:19px}
.sheet p{color:var(--mut);margin:0 0 10px;font-size:14px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.sheet input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.sheet .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.sheet .col{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.err{color:#ff6b6b;font-size:13px;min-height:18px;margin-top:8px}
#rd{position:fixed;inset:0;z-index:20;background:#0c0c0e;color:#eee}
#pg{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;text-align:center}
#pg img{display:block;width:100%;max-width:820px;margin:0 auto;min-height:40vh}
#pg .nx{padding:40px 16px 80px}
#tb{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:rgba(12,12,14,.92);transition:transform .2s}
#tb.off{transform:translateY(-110%)}
#tb button,#tb select{background:#25262c;color:#eee;border:0;border-radius:8px;padding:8px 11px;max-width:42vw}
#tb .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#ct{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(12,12,14,.8);padding:4px 10px;border-radius:999px;font-size:12px}
</style>
</head>
<body>
<div id="app"><div id="top"></div><main id="mn"></main><nav class="bn" id="bn"></nav><button class="fab" id="fab" data-act="add" hidden aria-label="Thêm truyện"></button></div>
<input type="file" id="fd" webkitdirectory multiple hidden>
<input type="file" id="fi" accept="image/*" multiple hidden>
<input type="file" id="fj" accept=".json,application/json" hidden>
<input type="file" id="fp" accept="image/*" hidden>
<input type="file" id="fc" accept="image/*" multiple hidden>
<div id="modal" hidden></div>
<div id="rd" hidden><div id="tb"><button id="bk">←</button><span class="t" id="tt"></span><button id="fv" aria-label="Theo dõi">♡</button><button id="pv">‹</button><select id="cs"></select><button id="nxb">›</button></div><div id="pg"></div><div id="ct"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nat=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
const P=d=>`<svg viewBox="0 0 24 24">${d}</svg>`;
const IC={home:P('<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>'),grid:P('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),user:P('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),search:P('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),plus:P('<path d="M12 5v14M5 12h14"/>'),book:P('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>'),arrow:P('<path d="M5 12h14M13 6l6 6-6 6"/>'),edit:P('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),lib:P('<path d="M6 3h12v18l-6-4-6 4z"/>'),clock:P('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')};
const GEN=['Hành động','Phiêu lưu','Hài hước','Tình cảm','Kinh dị','Fantasy','Học đường','Đời thường','Khác'];
const cvr=c=>c.poster||((c.chapters.find(x=>x.files.length)||{files:[]}).files[0])||null;
function cimg(c,cls){const b=cvr(c);if(!b)return `<div class="${cls} ph">${esc((c.title||'?')[0].toUpperCase())}</div>`;const u=URL.createObjectURL(b);covers.push(u);return `<img class="${cls}" src="${u}" alt="">`}
let db=null,comics=[],tab='rec',list=null,gf=null,gf2=null,q='',cur=null,urls=[],obs=null,tmr=null,covers=[],me=null;
try{me=localStorage.getItem('tt_u')}catch(e){}

/* storage */
function openDB(){return new Promise(r=>{try{const o=indexedDB.open('tutruyen',2);o.onupgradeneeded=()=>{const d=o.result;if(!d.objectStoreNames.contains('c'))d.createObjectStore('c',{keyPath:'id'});if(!d.objectStoreNames.contains('a'))d.createObjectStore('a',{keyPath:'u'})};o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}})}
const st=(s,m)=>db.transaction(s,m).objectStore(s);
const dbAll=s=>new Promise(r=>{if(!db)return r([]);try{const o=st(s).getAll();o.onsuccess=()=>r(o.result||[]);o.onerror=()=>r([])}catch(e){r([])}});
const dbGet=(s,k)=>new Promise(r=>{if(!db)return r(null);try{const o=st(s).get(k);o.onsuccess=()=>r(o.result||null);o.onerror=()=>r(null)}catch(e){r(null)}});
const dbPut=(s,v)=>new Promise(r=>{if(!db)return r(false);try{const o=st(s,'readwrite').put(v);o.onsuccess=()=>r(true);o.onerror=()=>r(false)}catch(e){r(false)}});
const dbDel=(s,k)=>new Promise(r=>{if(!db)return r();try{const o=st(s,'readwrite').delete(k);o.onsuccess=o.onerror=()=>r()}catch(e){r()}});
const saveC=c=>dbPut('c',c);

/* render */
Object.assign(IC,{rank:P('<path d="M5 20V10M12 20V4M19 20v-7"/>'),compass:P('<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>'),follow:P('<circle cx="10" cy="8" r="4"/><path d="M3 21c0-4 3-6 7-6M18 8v6M15 11h6"/>'),face:P('<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 10h.01M15 10h.01"/>'),cloud:P('<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z"/>'),gear:P('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'),box:P('<path d="M3 8l9-5 9 5-9 5zM3 8v9l9 5 9-5V8M12 13v9"/>'),chev:P('<path d="M9 6l6 6-6 6"/>')});
let rt='rec',ct='all',cg='',unread=false,sortBy='new',ft='fol',mt='hist',rnd=null;
const NAV=[['rec','Đề xuất','home'],['cat','Phân loại','grid'],['fol','Theo dõi','follow'],['exp','Khám phá','compass'],['me','Tôi','face']];
const EM=['🌟','👑','💗','🔥','🌙','🍀'];
const genres=()=>[...new Set(comics.map(c=>c.genre||'Khác'))].sort(nat);
const byNew=()=>[...comics].sort((a,b)=>b.added-a.added);
const cont=()=>comics.filter(c=>c.p&&c.chapters[c.p.ch]).sort((a,b)=>b.p.t-a.p.t);
const fols=()=>comics.filter(c=>c.fav);
const byGen=g=>comics.filter(c=>(c.genre||'Khác')===g).sort((a,b)=>nat(a.title,b.title));
const LISTS={all:{t:'Thư viện',items:()=>[...comics].sort((a,b)=>nat(a.title,b.title))},cont:{t:'Đang đọc',items:cont},new:{t:'Mới thêm',items:byNew},fol:{t:'Theo dõi',items:fols}};
function card(c,o={}){
  const p=c.p,tot=c.chapters.length;let sub=`${IC.book}${tot} chap`,bar='';
  if(o.prog&&p&&c.chapters[p.ch]){const n=c.chapters[p.ch].files.length||1;sub='Chap '+(p.ch+1)+', trang '+(p.pg+1)+'/'+n;bar=`<div class="bar"><i style="width:${Math.min(100,Math.round((p.ch+(p.pg+1)/n)/tot*100))}%"></i></div>`}
  return `<div class="cd ${o.w?'w':''}" data-id="${c.id}">${cimg(c,'cv')}<button class="ed" data-ed="${c.id}" aria-label="Sửa">${IC.edit}</button><b>${esc(c.title)}</b><small>${sub}</small>${bar}</div>`;
}
function li(c){
  const p=c.p&&c.chapters[c.p.ch]?c.p:null,tot=c.chapters.length;
  return `<div class="li" data-id="${c.id}"><div class="lc">${cimg(c,'cv')}</div><div class="lb"><b>${esc(c.title)}</b><span class="tg">${esc(c.genre||'Khác')}</span><p>${p?'Đang đọc: chap '+(p.ch+1)+', trang '+(p.pg+1):'Chưa đọc'}</p><div class="st">${IC.book}${tot} chap${c.fav?' · Đã theo dõi':''}</div></div><div class="la"><button class="mini" data-fv="${c.id}" aria-label="Theo dõi">${c.fav?'♥':'♡'}</button><button class="mini" data-ed="${c.id}" aria-label="Sửa">${IC.edit}</button></div></div>`;
}
const row=(t,l,more,o,em)=>l.length?`<div class="rh"><h3>${em?em+' ':''}${esc(t)}</h3>${more?`<button data-more="${esc(more)}">Thêm${IC.chev}</button>`:''}</div><div class="hs">${l.map(c=>card(c,o)).join('')}</div>`:'';
const lst=l=>l.length?`<div class="ls">${l.map(li).join('')}</div>`:'';
const emptyAll=()=>`<div class="empty"><p>Chưa có truyện nào. Chọn thư mục hoặc ảnh trong máy để bắt đầu.</p><button class="btn" data-act="add">Thêm truyện</button></div>`;
const tabsH=(arr,attr,cur)=>arr.map(([k,l])=>`<button ${attr}="${esc(k)}" class="${cur===k?'on':''}">${esc(l)}</button>`).join('');

function render(){renderTop();renderMain();
  $('#bn').innerHTML=NAV.map(([k,l,i])=>`<button data-tab="${k}" class="${tab===k&&!list?'on':''}">${IC[i]}<span>${l}</span></button>`).join('');
  const f=$('#fab');f.innerHTML=IC.plus;f.hidden=!((tab==='fol'||tab==='me')&&!list&&!q);
}
function renderTop(){
  let h='';
  if(list)h=`<div class="tt"><button class="rb" data-back="1" aria-label="Quay lại">←</button><h2>${esc(list.t)}</h2></div>`;

  else if(tab==='fol')h=`<div class="tt"><div class="tabs t2">${tabsH([['fol','Theo dõi'],['cont','Đang đọc']],'data-ft',ft)}</div><button class="rb" data-act="search" aria-label="Tìm kiếm">${IC.search}</button><button class="rb" data-act="backup" aria-label="Sao lưu">${IC.cloud}</button></div>`;
  else if(tab==='exp')h=`<div class="tt c"><h2>Khám phá</h2></div>`;

function renderMain(){
  covers.forEach(URL.revokeObjectURL);covers=[];
  const m=$('#mn');let h='';
  if(list){const l=list.items();m.innerHTML=l.length?lst(l):'<div class="empty">Chưa có truyện nào.</div>';return}

  if(tab==='me'){

  }
  if(!comics.length){m.innerHTML=emptyAll();return}
  if(tab==='rec'){
    if(rt!=='rec'&&genres().includes(rt)){m.innerHTML=`<div class="grid">${byGen(rt).map(c=>card(c)).join('')}</div>`;return}
    h=`<div class="sc">${[['all','lib','Thư viện'],['cont','clock','Đang đọc'],['new','rank','Mới thêm'],['add','plus','Thêm truyện']].map(([k,i,l])=>`<button ${k==='add'?'data-act="add"':`data-lst="${k}"`}><span class="ic">${IC[i]}</span>${l}</button>`).join('')}</div>`;

    if(sg.length)h+=`<div class="rh"><h3>💗 Có thể bạn sẽ thích</h3></div>`+lst(sg);
    m.innerHTML=h;return;
  }
  if(tab==='cat'){
    let l=ct==='cont'?cont():ct==='fol'?fols():[...comics];
    if(cg)l=l.filter(c=>(c.genre||'Khác')===cg);
    if(unread)l=l.filter(c=>!c.p);
    const S={new:(a,b)=>b.added-a.added,name:(a,b)=>nat(a.title,b.title),read:(a,b)=>((b.p&&b.p.t)||0)-((a.p&&a.p.t)||0),chap:(a,b)=>b.chapters.length-a.chapters.length};

  }

    if(ft==='cont'){const l=cont();m.innerHTML=l.length?lst(l):'<div class="empty">Bạn chưa đọc truyện nào.</div>';return}

  const r=comics.find(c=>c.id===rnd);
  h=`<div class="rc"><h3>Hôm nay đọc gì?</h3><p>Chọn ngẫu nhiên một truyện trong tủ của bạn.</p><button class="btn" data-act="rand">${IC.compass}Chọn ngẫu nhiên</button></div>`+(r?lst([r]):'');
  h+=row('Nhiều chap nhất',[...comics].sort((a,b)=>b.chapters.length-a.chapters.length).slice(0,12),'',null,'📚')+row('Chưa đọc',comics.filter(c=>!c.p).slice(0,12),'',null,'✨')+row('Mới thêm',byNew().slice(0,12),'new',null,'🆕');
  m.innerHTML=h;
}

function pick(){addForm()}
const isImg=f=>f.type.startsWith('image/')||/\.(jpe?g|png|webp|gif|avif|bmp)$/i.test(f.name);
const gdl=()=>'<datalist id="gl">'+[...new Set([...GEN,...comics.map(c=>c.genre).filter(Boolean)])].map(x=>`<option value="${esc(x)}">`).join('')+'</datalist>';

$('#fp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f&&F&&isImg(f))setPoster(f)};

}
$('#fd').onchange=e=>{

/* account */
const b64=u=>btoa(String.fromCharCode(...u));
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256)))}
function authUI(mode){
  const reg=mode==='register';
  modal(`<div class="sheet"><h2>${reg?'Đăng ký':'Đăng nhập'}</h2><p>Tài khoản được lưu ngay trên thiết bị này, dùng để quản lý các bản sao lưu.</p><label>Tên đăng nhập</label><input id="au" autocomplete="username" autocapitalize="none" placeholder="3–24 ký tự: a-z, 0-9, . _ -"><label>Mật khẩu</label><input id="ap" type="password" autocomplete="${reg?'new-password':'current-password'}">${reg?'<label>Nhập lại mật khẩu</label><input id="ap2" type="password" autocomplete="new-password">':''}<div class="err" id="er"></div><div class="row"><button class="btn g" id="sw">${reg?'Đã có tài khoản':'Tạo tài khoản'}</button><button class="btn" id="go">${reg?'Đăng ký':'Đăng nhập'}</button></div></div>`);
  $('#sw').onclick=()=>authUI(reg?'login':'register');
  $('#go').onclick=async()=>{
    const u=$('#au').value.trim().toLowerCase(),pw=$('#ap').value,er=$('#er');
    if(!/^[a-z0-9_.-]{3,24}$/.test(u))return er.textContent='Tên đăng nhập cần 3–24 ký tự gồm a-z, 0-9, dấu chấm, gạch dưới hoặc gạch ngang.';
    if(pw.length<6)return er.textContent='Mật khẩu cần ít nhất 6 ký tự.';
    if(!db||!crypto.subtle)return er.textContent='Trình duyệt này không hỗ trợ lưu tài khoản.';
    try{
      const ex=await dbGet('a',u);
      if(reg){
        if(pw!==$('#ap2').value)return er.textContent='Hai mật khẩu chưa khớp.';
        if(ex)return er.textContent='Tên đăng nhập này đã có người dùng.';
        const salt=crypto.getRandomValues(new Uint8Array(16));
        await dbPut('a',{u,salt:b64(salt),h:await hashPw(pw,salt),at:Date.now()});
      }else{
        if(!ex||await hashPw(pw,unb(ex.salt))!==ex.h)return er.textContent='Sai tên đăng nhập hoặc mật khẩu.';
      }
      me=u;try{localStorage.setItem('tt_u',u)}catch(e){}
      closeM();render();
    }catch(e){er.textContent='Có lỗi xảy ra, hãy thử lại.'}
  };
}

/* backup */
function snapshot(){return{v:1,user:me,at:Date.now(),comics:comics.map(c=>({title:c.title,genre:c.genre||'Khác',added:c.added,p:c.p,fav:!!c.fav,chapters:c.chapters.map(x=>x.name)}))}}
function restore(o){
  if(!o||!Array.isArray(o.comics))throw 0;
  let ok=0,miss=0;
  o.comics.forEach(b=>{const c=comics.find(x=>x.title.toLowerCase()===String(b.title).toLowerCase());
    if(!c){miss++;return}
    c.genre=b.genre||c.genre;if(b.fav)c.fav=true;
    if(b.p&&c.chapters[b.p.ch]&&(!c.p||b.p.t>c.p.t))c.p=b.p;
    saveC(c);ok++});
  return{ok,miss};
}
async function cloudDoc(){try{if(!window.claude)return null;const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return null;const id=await u.id();if(!id)return null;return d.collection('data/users/'+id).doc('tt_'+me)}catch(e){return null}}
function backupUI(){
  if(!me){modal(`<div class="sheet"><h2>Cần đăng nhập</h2><p>Đăng nhập hoặc đăng ký tài khoản để sao lưu và khôi phục.</p><div class="col"><button class="btn" id="b1">Đăng nhập</button><button class="btn g" id="b2">Đăng ký</button></div></div>`);$('#b1').onclick=()=>authUI('login');$('#b2').onclick=()=>authUI('register');return}
  modal(`<div class="sheet"><h2>Sao lưu và khôi phục</h2><p>Bản sao lưu gồm tiến độ đọc, thể loại và danh sách truyện. Ảnh truyện nằm trong máy bạn nên không được sao lưu. Khi khôi phục, truyện được khớp theo tên.</p><div class="col"><button class="btn" id="c1">Sao lưu lên đám mây</button><button class="btn g" id="c2">Khôi phục từ đám mây</button><button class="btn g" id="f1">Tải tệp sao lưu</button><button class="btn g" id="f2">Khôi phục từ tệp</button></div><div class="err" id="er" style="color:var(--mut)"></div></div>`);
  if(!window.claude){$('#c1').remove();$('#c2').remove()}
  const say=t=>{const e=$('#er');if(e)e.textContent=t};
  $('#c1').onclick=async()=>{const d=await cloudDoc();if(!d)return say('Sao lưu đám mây cần đăng nhập claude.ai. Bạn có thể dùng tệp sao lưu.');try{await d.set(snapshot());say('Đã sao lưu lên đám mây.')}catch(e){say('Không sao lưu được, hãy thử lại sau.')}};
  $('#c2').onclick=async()=>{const d=await cloudDoc();if(!d)return say('Khôi phục đám mây cần đăng nhập claude.ai. Bạn có thể dùng tệp sao lưu.');try{const s=await d.get();if(!s.exists)return say('Chưa có bản sao lưu nào trên đám mây.');const r=restore(s.data());render();say(`Đã khôi phục ${r.ok} truyện${r.miss?`, ${r.miss} truyện chưa có trên máy này`:''}.`)}catch(e){say('Không khôi phục được, hãy thử lại sau.')}};
  $('#f1').onclick=async()=>{try{const fn='tu-truyen-sao-luu-'+me+'.json',data=JSON.stringify(snapshot());const d=window.claude&&await claude.use('downloads');if(d)await d.save({filename:fn,data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}say('Đã tạo tệp sao lưu.')}catch(e){say('Bạn đã huỷ hoặc không lưu được tệp.')}};
  $('#f2').onclick=()=>$('#fj').click();
}
$('#fj').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const r=restore(JSON.parse(await f.text()));render();backupUI();const er=$('#er');if(er)er.textContent=`Đã khôi phục ${r.ok} truyện${r.miss?`, ${r.miss} truyện chưa có trên máy này`:''}.`}
  catch(x){backupUI();const er=$('#er');if(er)er.textContent='Tệp sao lưu không hợp lệ.'}};

/* reader */
async function read(id,ch,pg){
  const c=comics.find(x=>x.id===id);if(!c)return;
  cur={c,ch};
  const R=$('#rd'),PG=$('#pg');R.hidden=false;document.body.style.overflow='hidden';
  $('#tt').textContent=c.title;$('#fv').textContent=c.fav?'♥':'♡';
  $('#cs').innerHTML=c.chapters.map((x,i)=>`<option value="${i}" ${i===ch?'selected':''}>${esc(x.name)}</option>`).join('');
  urls.forEach(URL.revokeObjectURL);PG.innerHTML='';PG.scrollTop=0;
  const files=c.chapters[ch].files;
  urls=files.map(f=>URL.createObjectURL(f));
  const imgs=urls.map((u,i)=>{const im=new Image();im.src=u;im.alt='Trang '+(i+1);im.dataset.i=i;PG.append(im);return im});
  const nx=document.createElement('div');nx.className='nx';
  nx.innerHTML=ch<c.chapters.length-1?'<button class="btn" id="nn">Chương tiếp</button>':'<p style="color:#999">Bạn đã đọc hết truyện này.</p>';
  if(!files.length){const em=document.createElement('div');em.className='nx';em.innerHTML='<p style="color:#999">Chap này chưa có ảnh.</p><button class="btn">Chọn ảnh cho chap này</button>';em.querySelector('button').onclick=()=>$('#fc').click();PG.prepend(em)}
  PG.append(nx);if($('#nn'))$('#nn').onclick=()=>read(id,ch+1,0);
  pg=Math.max(0,Math.min(pg||0,imgs.length-1));
  if(pg>0){await Promise.all(imgs.slice(0,pg+1).map(im=>Promise.race([im.decode().catch(()=>{}),new Promise(r=>setTimeout(r,4000))])));imgs[pg].scrollIntoView()}
  if(obs)obs.disconnect();
  obs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const i=+en.target.dataset.i;$('#ct').textContent=(i+1)+' / '+imgs.length;c.p={ch,pg:i,t:Date.now()};clearTimeout(tmr);tmr=setTimeout(()=>saveC(c),500)}}),{root:PG,rootMargin:'-50% 0px -49% 0px',threshold:0});
  imgs.forEach(im=>obs.observe(im));
  $('#ct').textContent=imgs.length?(pg+1)+' / '+imgs.length:'';
  if(files.length&&(!c.p||c.p.ch!==ch))c.p={ch,pg,t:Date.now()};
}
function closeR(){
  $('#rd').hidden=true;document.body.style.overflow='';
  if(obs)obs.disconnect();urls.forEach(URL.revokeObjectURL);urls=[];$('#pg').innerHTML='';
  if(cur){saveC(cur.c);cur=null}render();
}
$('#bk').onclick=closeR;
$('#cs').onchange=e=>read(cur.c.id,+e.target.value,0);
$('#pv').onclick=()=>{if(cur.ch>0)read(cur.c.id,cur.ch-1,0)};
$('#nxb').onclick=()=>{if(cur.ch<cur.c.chapters.length-1)read(cur.c.id,cur.ch+1,0)};
$('#pg').onclick=e=>{if(e.target.tagName==='IMG')$('#tb').classList.toggle('off')};


if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{db=await openDB();comics=await dbAll('c');render()})();
</script>
